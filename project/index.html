<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ═══ Favicons & PWA ══════════════════════════════════════════════ -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#ea580c" />

    <!-- ═══ SEO ═══════════════════════════════════════════════════════════ -->
    <title>SAFETY — حلول الطاقة الشمسية والبديلة</title>
    <meta
      name="description"
      content="SAFETY — شركة متخصصة في الألواح الشمسية ومعدات الطاقة البديلة. بطاريات، إنفرترات، وحلول طاقة موثوقة. تواصل معنا عبر واتساب."
    />
    <link rel="canonical" href="https://alaman.site/" />

    <!-- ═══ Open Graph ═══════════════════════════════════════════════════ -->
    <meta property="og:site_name" content="SAFETY Solar" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://alaman.site/" />
    <meta property="og:title" content="SAFETY — حلول الطاقة الشمسية والبديلة" />
    <meta
      property="og:description"
      content="SAFETY — شركة متخصصة في الألواح الشمسية ومعدات الطاقة البديلة. بطاريات، إنفرترات، وحلول طاقة موثوقة."
    />
    <meta property="og:image" content="https://alaman.site/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ar_SY" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- ═══ Twitter Card ═══════════════════════════════════════════════════ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SAFETY — حلول الطاقة الشمسية والبديلة" />
    <meta
      name="twitter:description"
      content="SAFETY — شركة متخصصة في الألواح الشمسية ومعدات الطاقة البديلة."
    />
    <meta name="twitter:image" content="https://alaman.site/og-image.jpg" />

    <!-- ═══ Self-hosted Fonts (WOFF2, no external requests) ════════════ -->
    <!--
      Font files are stored in /public/fonts/ and served from the edge.
      Preload the two primary weights used above-the-fold.
      crossorigin is required for fonts even on same-origin.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/NotoSansArabic-Regular.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/NotoSansArabic-Bold.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/Inter-Regular.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/Inter-Bold.woff2"
      crossorigin
    />

    <!--
      LCP image preload — the hero background (hero-solar, self-hosted).
      This is the largest contentful paint element on the homepage.
    -->
    <link
      rel="preload"
      as="image"
      imagesrcset="
        /assets/images-opt/hero-solar-400.webp 400w,
        /assets/images-opt/hero-solar-800.webp 800w,
        /assets/images-opt/hero-solar-1200.webp 1200w
      "
      imagesizes="100vw"
      type="image/webp"
    />

    <!-- ═══ JSON-LD Structured Data ════════════════════════════════════ -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "SAFETY",
        "alternateName": "سافتي للطاقة الشمسية",
        "url": "https://alaman.site",
        "logo": "https://alaman.site/assets/images/safety-logo.png",
        "image": "https://alaman.site/og-image.jpg",
        "description": "شركة متخصصة في الألواح الشمسية ومعدات الطاقة البديلة — بطاريات، إنفرترات، وحلول طاقة موثوقة.",
        "telephone": "+963936143777",
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+963936143777",
          "contactType": "customer service",
          "availableLanguage": ["Arabic", "English"]
        },
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Sarmada",
          "addressCountry": "SY"
        },
        "sameAs": []
      }
    </script>
    <!-- ═══ Inline Critical CSS (Zero render blocking) ═════════════════ -->
    <style>
      html{scroll-behavior:smooth;overflow-x:clip;max-width:100vw}
      body{margin:0;background-color:#fff;color:#262626;-webkit-font-smoothing:antialiased}
      #root{min-height:100vh;display:flex;flex-direction:column}
      img,picture>img{max-width:100%;height:auto}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- type="module" is inherently deferred — no render-blocking -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
